<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <link rel="icon" href="favicon.ico" type="image/x-icon">
  <title>2048</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <h1>Игра 2048</h1>
    <div class="info">
      <div class="score-box">
        <div>Счёт</div>
        <div id="score">0</div>
      </div>
      <div class="controls">
        <button id="undoBtn" title="Отменить ход">↶ Undo</button>
        <button id="restartBtn" title="Начать заново">⟲ Restart</button>
        <button id="leaderBtn" title="Таблица лидеров">🏆 Leaders</button>
      </div>
    </div>
  </header>

  <main class="main">
    <section class="game-area">
      <div id="grid" class="grid"></div>

      <div id="overlay" class="overlay hidden">
        <div class="overlay-content" id="gameoverBox">
          <p id="gameoverMsg">Игра завершена</p>
          <div id="saveForm">
            <input id="playerName" placeholder="Введите имя" maxlength="30"/>
            <div class="overlay-actions">
              <button id="saveScoreBtn">Сохранить результат</button>
              <button id="overlayRestartBtn" title="Начать заново">⟲</button>
            </div>
          </div>
          <div id="savedMsg" class="hidden">Ваш рекорд сохранён ✅</div>
        </div>
      </div>
    </section>

    <aside id="leaderboardModal" class="modal hidden" aria-hidden="true">
      <div class="modal-inner">
        <h2>Таблица лидеров</h2>
        <table id="leaderboardTable">
          <thead>
            <tr><th>#</th><th>Имя</th><th>Очки</th><th>Дата</th></tr>
          </thead>
          <tbody></tbody>
        </table>
        <div class="modal-actions">
          <button id="closeLeaderBtn">Закрыть</button>
        </div>
      </div>
    </aside>
  </main>

  <nav id="mobileControls" class="mobile-controls">
    <button data-dir="up">↑</button>
    <div>
      <button data-dir="left">←</button>
      <button data-dir="down">↓</button>
      <button data-dir="right">→</button>
    </div>
  </nav>

  <script type="module" src="js/main.js"></script>
</body>
</html>
