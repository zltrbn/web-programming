<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="icon" href="favicon.ico" type="image/x-icon">
  <title>2048</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <h1>Игра 2048</h1>
    <div class="info">
      <div class="score-box">
        <div>Счёт</div>
        <div id="score">0</div>
      </div>
      <div class="controls">
        <button id="undoBtn" title="Отменить ход">↶ Undo</button>
        <button id="restartBtn" title="Начать заново">⟲ Restart</button>
      </div>
    </div>
  </header>

  <main class="main">
    <section class="game-area">
      <div id="grid" class="grid"></div>
    </section>
  </main>

  <script src="script.js" defer></script>
</body>
</html>
